[project]
name = "qvis"
version = "0.1.0"
description = "Interactive HTML visualizer for neqo/QUIC .sqlog (qlog) files"
readme = "README.md"
license = "Apache-2.0 OR MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
qvis = "qvis.cli:main"

[project.urls]
Repository = "https://github.com/larseggert/qvis"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff", "ty", "pytest"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
