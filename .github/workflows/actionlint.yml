name: Lint workflows

on:
  pull_request:

concurrency:
  group: actionlint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    uses: mozilla/actions/.github/workflows/actionlint.yml@42622e57e54d96514373f5234c0220b014e64740 # v3.1.1
    permissions:
      contents: read
      security-events: write # Required for zizmor to upload SARIF results
