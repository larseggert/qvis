name: Lint workflows

on:
  pull_request:

concurrency:
  group: actionlint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    uses: mozilla/actions/.github/workflows/actionlint.yml@21f6d303fcbd4e418481d01cf738591b847037b7 # v3.2.0
    permissions:
      contents: read
      security-events: write # Required for zizmor to upload SARIF results
