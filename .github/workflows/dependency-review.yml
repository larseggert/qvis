name: Dependency review

on:
  pull_request:

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    uses: mozilla/actions/.github/workflows/dependency-review.yml@42622e57e54d96514373f5234c0220b014e64740 # v3.1.1
    permissions:
      contents: read
