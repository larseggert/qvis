name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest
      - name: Smoke-test the built wheel in isolation
        run: |
          uv build
          python3 -m venv /tmp/qvis-wheel-venv
          /tmp/qvis-wheel-venv/bin/pip install dist/*.whl
          /tmp/qvis-wheel-venv/bin/qvis --help
          printf '{"trace":{"vantage_point":{"type":"client"}}}\x1e{"time":0.0,"name":"recovery:metrics_updated","data":{}}\x1e' > /tmp/smoke.sqlog
          /tmp/qvis-wheel-venv/bin/qvis --output-dir /tmp/qvis-wheel-out /tmp/smoke.sqlog
          grep -q "u-legend" /tmp/qvis-wheel-out/smoke.html
          ! grep -q "__[A-Z_]*__" /tmp/qvis-wheel-out/smoke.html

  js:
    name: js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npx biome ci .
      - name: Check vendored uPlot is up to date
        run: |
          git diff --exit-code -- src/qvis/uPlot.iife.min.js src/qvis/uPlot.min.css src/qvis/uPlot-LICENSE || {
            echo "::error::Vendored uPlot files are stale. Run 'npm install' and commit the result."
            exit 1
          }
