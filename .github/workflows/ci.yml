name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx biome ci .
      - name: Check vendored uPlot is up to date
        run: |
          git diff --exit-code -- src/qvis/uPlot.iife.min.js src/qvis/uPlot.min.css || {
            echo "::error::Vendored uPlot files are stale. Run 'npm install' and commit the result."
            exit 1
          }
